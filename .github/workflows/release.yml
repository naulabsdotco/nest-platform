name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version pull request is all version bumps and no changesets, which status reports as an
      # error; every other pull request must declare a changeset for what it ships.
      - name: a change that ships declares a changeset
        if: github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
      - run: pnpm exec nx run-many -t build
      - name: pack every package and fail on a missing dist file
        run: node scripts/release-dry-run.mjs
      - name: the packed tarball resolves under both require() and import()
        run: node scripts/pack-smoke.mjs

  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: auth-core publishes only past a signed security review
        run: node scripts/security-review.mjs

  version:
    needs: security-review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    permissions:
      contents: write # create or update changeset-release/main
      pull-requests: write # open or update the version pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Empty changesets only satisfy the pull-request gate; drop them so they neither open a release
      # pull request nor block publishing.
      - name: drop empty changesets
        run: node scripts/strip-empty-changesets.mjs
      # A version commit never lands on main: changesets puts it on changeset-release/main and a PR,
      # so protected main only ever receives commits through pull requests.
      - name: open or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm exec changeset version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: main
          # A token owned by a human starts CI on the release PR; github.token opens the PR without
          # dispatching pull_request events, so close and reopen it to trigger verify.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}

  publish:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # A missing or mismatched trusted publisher is the one failure a retry cannot fix. Exchange a
      # token for every package first, so it fails here with a named package instead of mid-publish.
      - name: every package trusts this workflow
        run: |
          set -euo pipefail
          id_token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?id-token: write is missing}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL:?id-token: write is missing}&audience=npm:registry.npmjs.org" |
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).value')
          for package in config logging errors auth-core; do
            curl -sS --fail-with-body -o /dev/null -X POST -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@naulabsco%2F$package" ||
              { echo "::error::no trusted publisher for @naulabsco/$package"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build
      - name: pack the versioned packages and fail on a missing dist file
        run: node scripts/release-dry-run.mjs
      # changesets publishes through pnpm, which rewrites workspace:* and exchanges the GitHub OIDC
      # token for a short-lived npm token per package. No stored token; OIDC attaches provenance.
      - name: publish with npm provenance
        env:
          PNPM_CONFIG_PROVENANCE: 'true'
        run: pnpm exec changeset publish
