name: release

on:
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The publish job lands in ticket #18, once the packages exist and the
      # @naulabs npm organisation and NPM_TOKEN secret are in place.
      - run: pnpm exec changeset status
